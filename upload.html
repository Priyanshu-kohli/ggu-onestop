<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Notes | GGU OneStop</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 20px; display: flex; align-items: center; justify-content: center;
      font-family: Arial, sans-serif; background: #f1f5fb;
    }
    .card { background: white; width: 100%; max-width: 480px; padding: 30px; border-radius: 14px; box-shadow: 0 5px 24px #00000012; }
    h1 { color: #10264b; margin-top: 0; font-size: 24px; }
    p { line-height: 1.5; color: #475569; font-size: 14px; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; font-size: 14px; }
    input[type="text"], select, input[type="file"] {
      display: block; width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 7px; font-size: 14px;
    }
    button {
      width: 100%; padding: 12px; margin-top: 20px; border: 0; border-radius: 7px;
      background: #174ea6; color: white; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    button:hover { background: #123d82; }
    button:disabled { opacity: .6; cursor: wait; }
    #message { margin-top: 15px; font-size: 14px; overflow-wrap: anywhere; }
    .nav-links { margin-top: 20px; display: flex; justify-content: space-between; font-size: 14px; }
    a { color: #174ea6; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Upload Notes / PDF</h1>
    <p>Please select your Department and Semester, then submit the PDF.</p>

    <form id="uploadForm">
      <label for="title">Resource Title</label>
      <input type="text" id="title" placeholder="e.g., B.Sc Chemistry Notes" required>

      <label for="department">Department / School</label>
      <select id="department" required>
        <option value="">-- Select Department --</option>
        <optgroup label="School of Studies in Engineering & Technology">
          <option value="Computer Science & Engineering">Computer Science & Engineering</option>
          <option value="Information Technology">Information Technology</option>
          <option value="Electronics & Communication">Electronics & Communication</option>
          <option value="Mechanical Engineering">Mechanical Engineering</option>
          <option value="Civil Engineering">Civil Engineering</option>
          <option value="Chemical Engineering">Chemical Engineering</option>
          <option value="Industrial & Production">Industrial & Production</option>
        </optgroup>
        <optgroup label="School of Studies in Mathematical & Computational Sciences">
          <option value="Computer Science (MCA/M.Sc)">Computer Science (MCA / M.Sc)</option>
          <option value="Mathematics">Mathematics</option>
          <option value="Statistics">Statistics</option>
        </optgroup>
        <optgroup label="School of Studies in Physical Sciences">
          <option value="Physics">Physics</option>
          <option value="Chemistry">Chemistry</option>
          <option value="Electronics">Electronics</option>
          <option value="Pure & Applied Physics">Pure & Applied Physics</option>
        </optgroup>
        <optgroup label="School of Studies in Life Sciences">
          <option value="Botany">Botany</option>
          <option value="Zoology">Zoology</option>
          <option value="Biotechnology">Biotechnology</option>
          <option value="Microbiology">Microbiology</option>
          <option value="Forensic Science">Forensic Science</option>
        </optgroup>
        <optgroup label="Other Major Departments">
          <option value="Pharmacy">Pharmacy</option>
          <option value="Management Studies">Management Studies (MBA)</option>
          <option value="Commerce">Commerce & Financial Studies</option>
          <option value="Law">Law</option>
          <option value="Economics">Economics</option>
          <option value="English">English & Foreign Languages</option>
          <option value="Journalism & Mass Comm">Journalism & Mass Communication</option>
          <option value="Rural Technology">Rural Technology & Social Development</option>
          <option value="Forestry">Forestry, Wildlife & Environmental Sciences</option>
          <option value="Social Work">Social Work</option>
          <option value="History">History</option>
          <option value="Political Science">Political Science</option>
          <option value="Hindi">Hindi</option>
        </optgroup>
      </select>

      <label for="semester">Semester</label>
      <select id="semester" required>
        <option value="">-- Select Semester --</option>
        <option value="1st Semester">1st Semester</option>
        <option value="2nd Semester">2nd Semester</option>
        <option value="3rd Semester">3rd Semester</option>
        <option value="4th Semester">4th Semester</option>
        <option value="5th Semester">5th Semester</option>
        <option value="6th Semester">6th Semester</option>
        <option value="7th Semester">7th Semester</option>
        <option value="8th Semester">8th Semester</option>
      </select>

      <label for="pdfFile">Select PDF File</label>
      <input type="file" id="pdfFile" accept="application/pdf" required>

      <button type="submit" id="uploadBtn">Upload Resource</button>
    </form>

    <p id="message" role="status"></p>

    <div class="nav-links">
      <a href="index.html">&larr; Back to Home</a>
      <a href="login.html">Logout</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (() => {
      const PROJECT_URL = 'https://dmrlbgtnntjcobctizia.supabase.co';
      const PUBLISHABLE_KEY = 'sb_publishable_e21JbOKbFioWArDYBKNGAQ_eHbz_5SN';
      const LOGIN_URL = 'https://priyanshuraj-ggvian.github.io/ggu-onestop/login.html';

      const supabase = window.supabase.createClient(PROJECT_URL, PUBLISHABLE_KEY);

      const form = document.getElementById('uploadForm');
      const titleInput = document.getElementById('title');
      const deptInput = document.getElementById('department');
      const semInput = document.getElementById('semester');
      const fileInput = document.getElementById('pdfFile');
      const uploadBtn = document.getElementById('uploadBtn');
      const message = document.getElementById('message');

      function showMessage(text, isError = false) {
        message.textContent = text;
        message.style.color = isError ? '#b91c1c' : '#166534';
      }

      async function checkUserSession() {
        const { data: { session }, error } = await supabase.auth.getSession();
        if (error || !session) {
          alert('Login is required to upload notes!');
          window.location.assign(LOGIN_URL);
        }
      }

      checkUserSession();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        uploadBtn.disabled = true;
        showMessage('Uploading file, please wait...');

        try {
          const title = titleInput.value.trim();
          const department = deptInput.value;
          const semester = semInput.value;
          const file = fileInput.files[0];

          if (!file) throw new Error('Please select a PDF file.');

          const fileExt = file.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;

          const { error: uploadError } = await supabase.storage
            .from('RESOURCES')
            .upload(fileName, file);

          if (uploadError) throw uploadError;

          const { error: dbError } = await supabase
            .from('resources')
            .insert([
              { 
                title: title, 
                department: department,
                semester: semester,
                file_url: fileName, 
                published: false 
              }
            ]);

          if (dbError) throw dbError;

          showMessage('Upload successful! It will appear in the public list after admin approval.');
          form.reset();

        } catch (err) {
          showMessage('Upload failed: ' + err.message, true);
        } finally {
          uploadBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
