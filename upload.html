<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Notes | GGU OneStop</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f1f5fb;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 450px;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 5px 24px #00000012;
    }
    h1 { color: #10264b; margin-top: 0; font-size: 24px; }
    p { line-height: 1.5; color: #475569; font-size: 14px; }
    label { display: block; margin: 16px 0 7px; font-weight: bold; font-size: 14px; }
    input[type="text"], input[type="file"] {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      border: 0;
      border-radius: 7px;
      background: #174ea6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #123d82; }
    button:disabled { opacity: .6; cursor: wait; }
    #message { margin-top: 15px; font-size: 14px; overflow-wrap: anywhere; }
    .nav-links { margin-top: 20px; display: flex; justify-content: space-between; font-size: 14px; }
    a { color: #174ea6; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Upload Notes / PDF</h1>
    <p>PDF submit karo. Admin approval ke baad hi ye public view mein show hoga.</p>

    <form id="uploadForm">
      <label for="title">Resource Title</label>
      <input type="text" id="title" placeholder=" jaise: B.Sc Maths Notes" required>

      <label for="pdfFile">Select PDF File</label>
      <input type="file" id="pdfFile" accept="application/pdf" required>

      <button type="submit" id="uploadBtn">Upload Resource</button>
    </form>

    <p id="message" role="status"></p>

    <div class="nav-links">
      <a href="index.html">← Back to Home</a>
      <a href="login.html" id="authLink">Logout / Switch Account</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (() => {
      const PROJECT_URL = 'https://dmrlbgtnntjcobctizia.supabase.co';
      const PUBLISHABLE_KEY = 'sb_publishable_e21JbOKbFioWArDYBKNGAQ_eHbz_5SN';
      const LOGIN_URL = 'https://priyanshuraj-ggvian.github.io/ggu-onestop/login.html';

      const supabase = window.supabase.createClient(PROJECT_URL, PUBLISHABLE_KEY);

      const form = document.getElementById('uploadForm');
      const titleInput = document.getElementById('title');
      const fileInput = document.getElementById('pdfFile');
      const uploadBtn = document.getElementById('uploadBtn');
      const message = document.getElementById('message');

      function showMessage(text, isError = false) {
        message.textContent = text;
        message.style.color = isError ? '#b91c1c' : '#166534';
      }

      // Check karein ki user logged in hai ya nahi
      async function checkUserSession() {
        const { data: { session }, error } = await supabase.auth.getSession();
        if (error || !session) {
          alert('Pehle login karna zaroori hai!');
          window.location.assign(LOGIN_URL);
        }
      }

      checkUserSession();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        uploadBtn.disabled = true;
        showMessage('Uploading file, please wait...');

        try {
          const title = titleInput.value.trim();
          const file = fileInput.files[0];

          if (!file) throw new Error('Koi PDF file select karein.');

          // 1. Unique file path banayein
          const fileExt = file.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
          const filePath = `${fileName}`;

          // 2. Supabase Storage (resources bucket) mein upload karein
          const { error: uploadError } = await supabase.storage
            .from('resources')
            .upload(filePath, file);

          if (uploadError) throw uploadError;

          // 3. Database (resources table) mein record insert karein
          const { error: dbError } = await supabase
            .from('resources')
            .insert([
              { 
                title: title, 
                file_url: filePath, 
                published: false 
              }
            ]);

          if (dbError) throw dbError;

          showMessage('Upload successful! Admin approval ke baad yeh list mein dikhega.');
          form.reset();

        } catch (err) {
          showMessage('Upload fail hua: ' + err.message, true);
        } finally {
          uploadBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
